# Builds oeee-cafe for every commit on main and pushes it to GHCR as
# ghcr.io/oeee-cafe/web:<commit>, which is what a deploy has the server pull.
# The development Mac deploys over a cellular connection, so the image and the
# debug info never pass through it: GitHub builds the image and uploads the debug info to Sentry,
# and the server downloads the image itself.
#
# Debug info reaches Sentry before the image is pushed, so an image the server
# can pull is always one whose stack traces Sentry can symbolicate.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only main's newest commit is ever deployed, so a build that a newer push has
# overtaken is not worth finishing.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oeee-cafe/web
  SENTRY_ORG: limeburst
  SENTRY_PROJECT: oeee-cafe-web
  SENTRY_JS_PROJECT: neo-cucumber

jobs:
  # Unformatted Rust does not ship: a commit cargo fmt would change builds no
  # image. Seconds, with no database and no compile.
  format:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  build:
    needs: format
    # The server is arm64 too, so this builds natively rather than under QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # sqlx checks every query against a real schema at compile time. The
      # compile runs on this runner, so the database is published on
      # localhost:5433.
      - name: Start the build database
        run: |
          docker run -d --quiet --name build-db -p 5433:5433 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=oeee_cafe \
            postgres:18 -c port=5433
          # Over TCP: while the image initialises the database it runs a server
          # on the socket alone, and pg_isready there would answer too soon.
          for _ in $(seq 60); do
            docker exec build-db pg_isready -q -h 127.0.0.1 -p 5433 -U postgres && break
            sleep 1
          done
          docker exec build-db pg_isready -h 127.0.0.1 -p 5433 -U postgres

      # With psql rather than sqlx-cli, which would be a compile of its own.
      # Each file in a transaction of its own, as sqlx runs them.
      - name: Apply migrations
        run: |
          for migration in migrations/*.up.sql; do
            docker exec -i build-db psql -q -X -v ON_ERROR_STOP=1 --single-transaction \
              -h 127.0.0.1 -p 5433 -U postgres oeee_cafe < "$migration"
          done

      # The Rust binary is built here rather than in the Dockerfile. In
      # BuildKit its compiler cache had to be carried in and out of the
      # builder whole: 9 GB by October, most of it dependencies no longer in
      # Cargo.lock, which took three and a half minutes to load before every
      # build and nine to save after. rust-cache keeps target/ with only what
      # this lockfile builds. The toolchain is the Dockerfile's rust image's.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Install mold and OpenSSL's headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mold libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2

      # What the Dockerfile's rust-builder makes, into a directory outside the
      # checkout (target/ is not the image's context's business either), which
      # the image builds below take in place of that stage (build-contexts).
      # The release profile's debug info is split off as there: the image gets
      # the binary without it, and oeee-cafe.debug goes to Sentry, which puts
      # file, line and inlined frames back into its stack traces by the GNU
      # build id the two share. The symbol table stays in, so a backtrace in
      # `docker logs` still names its functions.
      - name: Build the server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/oeee_cafe
        run: |
          mold -run cargo build --release --locked
          out="$RUNNER_TEMP/rust-binary"
          mkdir -p "$out"
          cp target/release/oeee-cafe "$out/oeee-cafe"
          objcopy --only-keep-debug --compress-debug-sections=zlib "$out/oeee-cafe" "$out/oeee-cafe.debug"
          objcopy --strip-debug "$out/oeee-cafe"

      - uses: docker/setup-buildx-action@v4

      - name: Build the debug info and source maps
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: rust-binary=${{ runner.temp }}/rust-binary
          platforms: linux/arm64
          target: debug-files
          outputs: type=local,dest=debug-files
          cache-from: type=gha

      - uses: jdx/mise-action@v4
        with:
          install_args: sentry-cli

      - name: Upload the debug info and source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::The SENTRY_AUTH_TOKEN secret is not set, so this release's stack traces would have no file or line"
            exit 1
          fi
          sentry-cli debug-files upload --no-zips debug-files
          sentry-cli sourcemaps upload --project "$SENTRY_JS_PROJECT" debug-files/sourcemaps

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything but the last stage comes from the build above. GIT_COMMIT
      # versions the static asset URLs the server hands out, so each deploy
      # invalidates browser and CDN caches exactly once. No provenance
      # attestation, so what the server pulls is one plain arm64 manifest.
      # A deploy waits for this step by name, not for the run, so it pulls
      # without waiting for the caches to save. Renaming it breaks that.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: rust-binary=${{ runner.temp }}/rust-binary
          platforms: linux/arm64
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
