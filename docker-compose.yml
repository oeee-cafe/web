# Blue/green: two identical app services, one serving at a time, with `proxy`
# holding the published port across the switch. Compose has no rolling update
# outside Swarm, so deploy-server.sh drives the sequence -- see the header there.
#
# Room state, sequencing and presence all live in Redis, and sessions live in
# Postgres, so it does not matter to a client which colour it lands on: a
# drawing session survives the swap by reconnecting and resuming from its last
# canonical sequence number.
x-oeee-cafe: &oeee-cafe
  # Both colours run the same image. It is built on another machine and loaded
  # here by deploy.sh, and deploy-server.sh points this tag at it before
  # starting whichever colour is idle. There is deliberately no `build:`: a
  # build here is what used to peg this machine's CPU on every deploy.
  image: oeee-cafe:current
  # Without a `build:`, a missing image would send compose to Docker Hub for
  # someone else's `oeee-cafe`. Fail instead.
  pull_policy: never
  volumes:
    - ./config:/app/config:ro
  networks:
    - oeee-cafe-network
  # Not `always`: a colour that deploy.sh stopped must stay stopped, and
  # `always` starts manually stopped containers again when the daemon restarts,
  # which after a reboot would leave both colours running.
  restart: unless-stopped
  # On SIGTERM the server waits up to 10s for open drawing sessions to close
  # cleanly. Docker's default 10s grace period would SIGKILL it right as that
  # wait expires, so give it room to finish and exit on its own.
  stop_grace_period: 20s
  # `restart: unless-stopped` only notices a process that exited. This catches
  # the other failure: still running, but unable to reach the database.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # The only service publishing a port, so a deploy never leaves cloudflared's
  # origin unanswered. Deliberately without depends_on: it must come up whether
  # or not the colour it points at is the one currently running.
  proxy:
    image: caddy:2-alpine
    container_name: oeee-cafe-proxy
    ports:
      - "30000:80"
    # The whole directory, not just the file: deploy.sh replaces
    # proxy/upstream.caddy, and a single-file bind mount would keep showing the
    # container the replaced inode.
    volumes:
      - ./proxy:/etc/caddy:ro
    networks:
      - oeee-cafe-network
    restart: always

  oeee-cafe-blue:
    <<: *oeee-cafe
    container_name: oeee-cafe-blue

  oeee-cafe-green:
    <<: *oeee-cafe
    container_name: oeee-cafe-green

networks:
  oeee-cafe-network:
    driver: bridge
