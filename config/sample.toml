env = "dev"
base_url = "http://localhost:3000"
domain = "localhost:3000"
port = 3000

# tracing env-filter directive; RUST_LOG overrides this when set.
log_level = "info"
# Leave empty to disable Sentry error reporting.
sentry_dsn = ""

db_url = "postgres://"
db_max_connections = 5
db_acquire_timeout = 3

redis_url = "redis://localhost:6379"
redis_max_connections = 10

official_account_login_name = ""

aws_access_key_id = "aws_access_key_id"
aws_secret_access_key = "aws_secret_access_key"
aws_region = "aws_region"
aws_s3_bucket = "aws_s3_bucket"
r2_endpoint_url = "r2_endpoint_url"
r2_public_endpoint_url = "r2_public_endpoint_url"

# Collaborative session recordings and synchronisation reports. Must be a
# bucket of its own with no public access: aws_s3_bucket above is served
# straight to browsers, and a recording is a whole private drawing session.
# Leave it unset to record nothing.
# archive_s3_bucket = "oeee-cafe-archive"

# Mail goes out over TLS on port 465; the sender is each language's
# email-from-address (locales/).
smtp_host = ""
smtp_user = ""
smtp_password = ""

# Sign in with Steam, from the Oeee Cafe app on Steam, and its achievements.
# Leave the table out to turn both off. web_api_key is a publisher key, not a
# user's. The achievements' API names in Steamworks are FIRST_DRAWING,
# FIRST_RELAY, FIRST_COLLABORATION and STEAM_SUPPORTER, each set to be unlocked by the game
# server ("Set By: Official GS"); the server unlocks them itself.
# [steam]
# app_id = 0
# web_api_key = ""

# The Supporter Packs every store sells are listed at /admin/store, not here.

# Sign in with Apple. Leave the table out to turn it off. client_id is the
# Services ID whose return URL is {base_url}/auth/apple/callback; app_ids are
# the bundle ids of the apps that sign in natively (the iOS app), whose tokens
# name the bundle id as audience rather than the Services ID.
# [apple]
# client_id = "cafe.oeee.web"
# app_ids = ["cafe.oeee"]

# Sign in with Google. Leave the table out to turn it off. client_id and
# client_secret are a Web application OAuth client's (Google Cloud console >
# APIs & Services > Credentials), with {base_url}/auth/google/callback as an
# authorised redirect URI. The Android app signs in with Credential Manager
# and is given this same client id as its server client id, so its tokens name
# it as audience too; it needs an Android OAuth client of its own in the same
# project, with the signing certificate's SHA-1, but nothing here. The other
# apps sign in in a browser, with this same client.
# [google]
# client_id = "0000.apps.googleusercontent.com"
# client_secret = ""

# The App Store's side of the iOS app: what the Supporter Pack is sold as,
# and the key that asks Apple about a purchase. Separate credentials from
# [apple] above, from App Store Connect > Users and Access > Integrations >
# In-App Purchase: issuer_id is printed above the key list, key_id beside the
# key, and private_key_path points at the .p8 that download gave you -- kept
# here in config/, which is not in the repository, and read from /app/config
# in the container.
#
# A transaction production has never heard of is asked about in Apple's
# sandbox, so TestFlight and Xcode builds work without a second deployment.
# [app_store]
# issuer_id = "00000000-0000-0000-0000-000000000000"
# key_id = "ABCD123456"
# private_key_path = "config/SubscriptionKey_ABCD123456.p8"
# bundle_id = "cafe.oeee"

# The Microsoft Store's side of the Windows app. Leave the table out and the
# Microsoft Store build sells nothing. tenant_id is the Microsoft Entra tenant
# associated with the Partner Center account; client_id and client_secret are
# a web app registered in it and added to the app's product in Partner Center
# (Product management > Product collections and purchases). The add-ons it
# sells are listed at /admin/store by their Store IDs.
# [microsoft_store]
# tenant_id = "00000000-0000-0000-0000-000000000000"
# client_id = "00000000-0000-0000-0000-000000000000"
# client_secret = ""

# Google Play's side of the Android app. Leave the table out and the Android
# app sells nothing. service_account_path is a JSON key of a Google Cloud
# service account with the Google Play Android Developer API enabled in its
# project, invited in Play Console (Users and permissions) with "View
# financial data" and "Manage orders and subscriptions" for the app. The
# one-time products it sells are listed at /admin/store by their product ids.
# [google_play]
# package_name = "cafe.oeee"
# service_account_path = "config/google-play-service-account.json"
