env = "dev"
base_url = "http://localhost:3000"
domain = "localhost:3000"
port = 3000

# tracing env-filter directive; RUST_LOG overrides this when set.
log_level = "info"
# Leave empty to disable Sentry error reporting.
sentry_dsn = ""

db_url = "postgres://"
db_max_connections = 5
db_acquire_timeout = 3

redis_url = "redis://localhost:6379"
redis_max_connections = 10
redis_acquire_timeout = 5

official_account_login_name = ""

aws_access_key_id = "aws_access_key_id"
aws_secret_access_key = "aws_secret_access_key"
aws_region = "aws_region"
aws_s3_bucket = "aws_s3_bucket"
r2_endpoint_url = "r2_endpoint_url"
r2_public_endpoint_url = "r2_public_endpoint_url"

# Collaborative session recordings and synchronisation reports. Must be a
# bucket of its own with no public access: aws_s3_bucket above is served
# straight to browsers, and a recording is a whole private drawing session.
# Leave it unset to record nothing.
# archive_s3_bucket = "oeee-cafe-archive"

smtp_host = ""
smtp_port = 587
smtp_user = ""
smtp_password = ""
email_from_address = ""

# Sign in with Steam, from the Oeee Cafe app on Steam, and its achievements.
# Leave the table out to turn both off. web_api_key is a publisher key, not a
# user's. The achievements' API names in Steamworks are FIRST_DRAWING,
# FIRST_RELAY, FIRST_COLLABORATION and STEAM_SUPPORTER, each set to be unlocked by the game
# server ("Set By: Official GS"); the server unlocks them itself.
# supporter_app_ids are the Steam apps whose owners are supporters -- the
# Supporter Pack DLC -- and owning any one outright earns STEAM_SUPPORTER, the
# supporter badge and a line in the credits on /about. To make every buyer of a paid app
# a supporter, add the app's id and keep the DLC's (a delisted DLC stays
# owned); linked Steam accounts are rechecked daily, so no one has to sign in.
# [steam]
# app_id = 0
# web_api_key = ""
# supporter_app_ids = [0]

# Sign in with Apple. Leave the table out to turn it off. client_id is the
# Services ID whose return URL is {base_url}/auth/apple/callback; app_ids are
# the bundle ids of the apps that sign in natively (the iOS app), whose tokens
# name the bundle id as audience rather than the Services ID.
# [apple]
# client_id = "cafe.oeee.web"
# app_ids = ["cafe.oeee"]

# Sign in with Google. Leave the table out to turn it off. client_id and
# client_secret are a Web application OAuth client's (Google Cloud console >
# APIs & Services > Credentials), with {base_url}/auth/google/callback as an
# authorised redirect URI. The Android app signs in with Credential Manager
# and is given this same client id as its server client id, so its tokens name
# it as audience too; it needs an Android OAuth client of its own in the same
# project, with the signing certificate's SHA-1, but nothing here.
# [google]
# client_id = "0000.apps.googleusercontent.com"
# client_secret = ""
